[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "secretsense"
version = "0.1.0"
description = "A local secret scanner with redacted reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pathspec>=0.12.1,<2", "typer>=0.16,<1"]

[project.optional-dependencies]
api = ["fastapi>=0.142.2,<1", "uvicorn>=0.54,<1", "httpx>=0.28.1,<1"]
ml = ["scikit-learn>=1.7,<2"]
experiments = ["scikit-learn>=1.7,<2", "xgboost>=3,<4"]
plots = ["matplotlib>=3.10,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2", "pip-audit>=2.9,<3", "pre-commit>=4,<5"]

[project.scripts]
secretsense = "secretsense.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
