name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: python -m pip install --upgrade pip 'setuptools>=83' wheel
      - run: python -m pip install -e './core[dev,ml,plots,experiments,api]'
      - run: ruff check core ml api .github/actions-runner
      - run: ruff format --check core ml api .github/actions-runner
      - run: pytest core/tests ml/tests api/tests --cov=secretsense --cov=ml.scripts --cov=api --cov-report=term-missing --cov-fail-under=85
      - run: python -m ml.scripts.build_dataset
      - run: python -m build core
      - run: pip-audit --skip-editable

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip 'setuptools>=83' wheel
      - run: python -m pip install -e './core[dev,ml,plots,experiments,api]'
      - run: pre-commit run --all-files

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./
        id: scanner
        with:
          path: core/secretsense
      - name: Check local SARIF output
        env:
          SARIF_PATH: ${{ steps.scanner.outputs.sarif }}
          SCAN_EXIT: ${{ steps.scanner.outputs.exit-code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ['SARIF_PATH']).read_text())
          assert os.environ['SCAN_EXIT'] == '0'
          assert report['version'] == '2.1.0'
          assert report['runs'][0]['invocations'][0]['executionSuccessful']
          PY

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e './core[api]'
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run format:check && npm run build && npm run typecheck
        working-directory: web
      - run: npm audit --omit=dev
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
        env:
          SECRETSENSE_PYTHON: python
      - run: npm run build:portfolio && npm run test:portfolio
        working-directory: web
